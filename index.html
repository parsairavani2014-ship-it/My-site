<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="color"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pixel Bazzar</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet"><style id="css">
:root,:root[data-theme="color"]{
  --bg:#e9e6f7;--surface:#fff;--ink:#1d1b3a;--muted:#5d5a80;--accent:#ff5c8a;--on-accent:#fff;--accent2:#ffd23f;--ok:#12a56a;--line:#1d1b3a;--chk:rgba(0,0,0,.07);
  --t1:#9be7c4;--t2:#ffd23f;--t3:#ff9db8;--t4:#a9b8ff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="white"]{--bg:#fff;--surface:#fff;--ink:#000;--muted:#555;--accent:#000;--on-accent:#fff;--accent2:#fff;--ok:#000;--line:#000;--chk:rgba(0,0,0,.06);--t1:#fff;--t2:#eee;--t3:#ddd;--t4:#f4f4f4}
:root[data-theme="black"]{--bg:#000;--surface:#0d0d0d;--ink:#fff;--muted:#aaa;--accent:#fff;--on-accent:#000;--accent2:#000;--ok:#fff;--line:#fff;--chk:rgba(255,255,255,.07);--t1:#111;--t2:#1c1c1c;--t3:#262626;--t4:#161616}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;line-height:1.7;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 80px}
.logo{font-family:"Press Start 2P","Vazirmatn",monospace;font-size:18px;display:inline-flex;gap:10px;align-items:center;margin:0;line-height:1.5}
.logo i{display:inline-block;width:22px;height:22px;background:var(--accent);box-shadow:6px 6px 0 var(--accent2);border:2px solid var(--line)}
.px{border:3px solid var(--line);background:var(--surface);box-shadow:6px 6px 0 var(--line)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn{border:3px solid var(--line);background:var(--accent2);color:var(--ink);font-weight:800;padding:8px 18px;box-shadow:4px 4px 0 var(--line)}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn.sm{padding:2px 12px;font-size:14px;box-shadow:3px 3px 0 var(--line)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.armed{background:#e5322d;color:#fff}
#login{display:grid;place-items:center;min-height:90vh}
.card{width:100%;max-width:420px;padding:28px 24px}
.card h2{margin:18px 0 6px;font-size:22px}
.card p{margin:0 0 18px;color:var(--muted)}
.field{display:flex;border:3px solid var(--line);background:var(--bg);direction:ltr}
.field span{padding:10px 14px;background:var(--accent);color:var(--on-accent);font-weight:800}
.field input{flex:1;min-width:0;border:0;background:transparent;padding:10px 12px;outline:0;direction:ltr;text-align:left}
.field:focus-within{outline:3px solid var(--accent);outline-offset:3px}
.err{color:#e5322d;min-height:26px;font-size:14px;margin:6px 0 10px;font-weight:600}
#loginBtn{width:100%;font-size:17px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.user{display:flex;align-items:center;gap:10px;font-weight:600}
.user b{direction:ltr;unicode-bidi:embed;background:var(--accent2);color:var(--ink);padding:2px 10px;border:2px solid var(--line)}
.search{display:flex;border:3px solid var(--line);background:var(--surface);box-shadow:6px 6px 0 var(--line);margin-bottom:14px}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:14px 16px;font-size:17px;outline:0}
.search:focus-within{outline:3px solid var(--accent);outline-offset:3px}
.search em{font-style:normal;padding:0 16px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-size:20px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 22px}
.chip{border:2px solid var(--line);background:var(--surface);padding:2px 14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.count{color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}
.item{display:flex;flex-direction:column}
.thumb{height:130px;display:grid;place-items:center;font-size:54px;border-bottom:3px solid var(--line);
  background-image:linear-gradient(45deg,var(--chk) 25%,transparent 25%,transparent 75%,var(--chk) 75%),linear-gradient(45deg,var(--chk) 25%,transparent 25%,transparent 75%,var(--chk) 75%);
  background-size:16px 16px;background-position:0 0,8px 8px}
.info{padding:12px 14px 16px;display:flex;flex-direction:column;gap:2px;flex:1}
.info h3{margin:0;font-size:16px;font-weight:800}
.info small{color:var(--muted)}
.price{margin-top:auto;padding-top:8px;font-weight:800;color:var(--ok)}
.adm{display:flex;gap:8px;padding-top:10px}
.empty{padding:40px 20px;text-align:center}
.empty b{font-size:20px;display:block;margin-bottom:6px}
#fab{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5}
#panel{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.55);display:flex;justify-content:flex-start;padding-top:env(safe-area-inset-top,0px)}
.sheet{width:min(460px,100%);height:100%;overflow:auto;padding:18px 18px 0;box-shadow:none;border-width:0 0 0 3px;display:flex;flex-direction:column}
.sheet h2{margin:0 0 6px;font-size:20px}
.sheet section{border-top:3px solid var(--line);padding:14px 0 16px}
.sheet h3{margin:0 0 10px;font-size:16px}
.sheet label{display:block;font-weight:600;margin:8px 0 4px;font-size:14px}
.in{width:100%;border:3px solid var(--line);background:var(--bg);padding:6px 10px;outline:0}
.in:focus{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row .in{flex:1;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.themes{display:flex;gap:8px;flex-wrap:wrap}
.foot{position:sticky;bottom:0;margin-top:auto;background:var(--surface);border-top:3px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#status{flex-basis:100%;font-size:14px;color:var(--muted);min-height:22px}
#adminLink{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;border:2px solid var(--line);background:var(--surface);color:var(--muted);padding:2px 12px;font-size:13px}
#auth{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
#auth .card{max-width:380px}
#auth .row{margin-top:14px}
[hidden]{display:none!important}
</style></head><body><template id="shell">
<main id="login" class="wrap">
  <form class="card px" id="loginForm" novalidate="" onsubmit="return false">
    <h1 class="logo" dir="auto"><i></i><span class="nm"></span></h1>
    <h2>ورود به بازار</h2>
    <p>برای دیدن محصولات، نام کاربری تلگرام خود را وارد کنید.</p>
    <label for="tg" style="display:block;font-weight:600;margin-bottom:6px">نام کاربری تلگرام</label>
    <div class="field"><span>@</span><input id="tg" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="username" maxlength="33"></div>
    <div class="err" id="err" role="alert"></div>
    <button class="btn" id="loginBtn" type="button">ورود با تلگرام</button>
  </form>
</main>
<main id="shop" class="wrap" hidden="">
  <header class="top">
    <h1 class="logo" dir="auto"><i></i><span class="nm"></span></h1>
    <div class="user"><span>خوش آمدید</span><b id="who"></b><button class="btn sm" id="logout" type="button">خروج</button></div>
  </header>
  <label class="search">
    <input id="q" type="search" placeholder="جستجوی محصول…" aria-label="جستجوی محصول" autocomplete="off">
    <em aria-hidden="true">⌕</em>
  </label>
  <div class="cats" id="cats" role="group" aria-label="دسته‌بندی"></div>
  <p class="count" id="count" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
</main>
<button class="btn pri" id="fab" type="button" data-act="open" hidden="">مدیریت فروشگاه</button>
<button id="adminLink" type="button" data-act="adminlogin">ورود مدیر</button>
<div id="auth" hidden="">
  <div class="card px" role="dialog" aria-labelledby="au-title">
    <h2 id="au-title" style="margin-top:0">ورود مدیر</h2>
    <p id="au-text">رمز مدیر را وارد کنید.</p>
    <div id="au-fields">
      <label for="au-pw" style="font-weight:600;font-size:14px">رمز</label>
      <input class="in" id="au-pw" type="password" dir="ltr" autocomplete="current-password" style="text-align:right">
      <div id="au-2" hidden=""><label for="au-pw2" style="font-weight:600;font-size:14px;display:block;margin-top:8px">تکرار رمز</label>
      <input class="in" id="au-pw2" type="password" dir="ltr" autocomplete="new-password" style="text-align:right"></div>
    </div>
    <div class="err" id="au-err" role="alert"></div>
    <div class="row"><button class="btn pri" id="au-go" type="button" data-act="authgo">ورود</button><button class="btn" type="button" data-act="authcancel">انصراف</button></div>
  </div>
</div>
<aside id="panel" hidden="">
  <div class="sheet px">
    <h2>مدیریت فروشگاه</h2>
    <section>
      <h3>نام و ظاهر</h3>
      <label for="a-name">نام فروشگاه</label>
      <input class="in" id="a-name" maxlength="40">
      <label>پوسته</label>
      <div class="themes" id="a-themes"></div>
    </section>
    <section>
      <h3>دسته‌بندی‌ها</h3>
      <div id="a-cats"></div>
      <div class="row"><input class="in" id="a-newcat" placeholder="دسته‌بندی جدید" maxlength="30" aria-label="دسته‌بندی جدید"><button class="btn sm" type="button" data-act="addcat">افزودن</button></div>
    </section>
    <section>
      <h3 id="a-ptitle">محصول جدید</h3>
      <label for="p-name">نام محصول</label><input class="in" id="p-name" maxlength="60">
      <div class="two">
        <div><label for="p-cat">دسته‌بندی</label><select class="in" id="p-cat"></select></div>
        <div><label for="p-emoji">شکلک</label><input class="in" id="p-emoji" maxlength="4" placeholder="🎮"></div>
      </div>
      <label for="p-price">قیمت (تومان)</label><input class="in" id="p-price" inputmode="numeric" dir="ltr" style="text-align:right">
      <label for="p-desc">توضیح کوتاه</label><input class="in" id="p-desc" maxlength="80">
      <div class="row" style="margin-top:12px"><button class="btn sm" type="button" data-act="saveprod">ثبت محصول</button><button class="btn sm" type="button" data-act="cancelprod">پاک کردن فرم</button></div>
      <div class="err" id="p-err" role="alert"></div>
    </section>
    <section>
      <h3>رمز مدیر</h3>
      <label for="c-old">رمز فعلی</label><input class="in" id="c-old" type="password" dir="ltr" autocomplete="current-password" style="text-align:right">
      <label for="c-new">رمز جدید (حداقل ۶ نویسه)</label><input class="in" id="c-new" type="password" dir="ltr" autocomplete="new-password" style="text-align:right">
      <label for="c-new2">تکرار رمز جدید</label><input class="in" id="c-new2" type="password" dir="ltr" autocomplete="new-password" style="text-align:right">
      <div class="row" style="margin-top:12px"><button class="btn sm" type="button" data-act="changepw">تغییر رمز</button></div>
      <div class="err" id="c-err" role="alert"></div>
    </section>
    <div class="foot">
      <button class="btn pri" type="button" data-act="publish">ذخیره و انتشار</button>
      <button class="btn" type="button" data-act="close">بستن</button>
      <button class="btn" type="button" data-act="adminout">خروج مدیر</button>
      <div id="status" role="status"></div>
    </div>
  </div>
</aside>
</template><div id="root"></div><script type="application/json" id="state">{"name":"Pixel Bazzar","theme":"color","cats":[],"products":[{"id":"p1","n":"کیبورد مکانیکی پیکسلی","c":"","e":"⌨️","p":2450000,"d":"سوییچ آبی، نورپردازی ۸ بیتی"},{"id":"p2","n":"موس گیمینگ سبک","c":"","e":"🖱️","p":980000,"d":"سنسور ۱۶۰۰۰ دی‌پی‌آی"},{"id":"p3","n":"هدست گیمینگ رترو","c":"","e":"🎧","p":1750000,"d":"صدای فراگیر، میکروفون جداشدنی"},{"id":"p4","n":"کنسول دستی ۸ بیتی","c":"","e":"🕹️","p":3200000,"d":"بیش از ۴۰۰ بازی کلاسیک"},{"id":"p5","n":"گیفت‌کارت استیم ۲۰ دلاری","c":"","e":"🎮","p":1450000,"d":"تحویل فوری کد دیجیتال"},{"id":"p6","n":"گیفت‌کارت پلی‌استیشن","c":"","e":"🎟️","p":1900000,"d":"مناسب حساب منطقه آمریکا"},{"id":"p7","n":"اشتراک ماهانه موسیقی","c":"","e":"🎵","p":420000,"d":"بدون تبلیغ، کیفیت بالا"},{"id":"p8","n":"پک پیکسل‌آرت کاراکتر","c":"","e":"👾","p":180000,"d":"۱۲۰ اسپرایت آماده، فرمت PNG"},{"id":"p9","n":"پک آیکون پیکسلی","c":"","e":"🧩","p":150000,"d":"۵۰۰ آیکون ۳۲ در ۳۲"},{"id":"p10","n":"فونت پیکسلی فارسی","c":"","e":"🔤","p":260000,"d":"پشتیبانی کامل از حروف فارسی"},{"id":"p11","n":"پوستر دیواری اینویدرز","c":"","e":"🖼️","p":340000,"d":"چاپ روی بوم، ۵۰ در ۷۰"},{"id":"p12","n":"چراغ خواب مکعبی","c":"","e":"💡","p":520000,"d":"نور رنگی با ریموت"},{"id":"p13","n":"ماگ پیکسل قلب","c":"","e":"☕","p":210000,"d":"سرامیکی، مناسب ماکروفر"},{"id":"p14","n":"پد موس بزرگ شهر شبانه","c":"","e":"🌃","p":390000,"d":"ضد لغزش، ۹۰ در ۴۰"}],"salt":"41a392742a3355194f25c99b84ad26cc","ph":"62743b316c6ae0672cca69b286b796c4a1b2363e05877fa8828c274bc5a8ea01"}</script><script id="app">
const S = JSON.parse(document.getElementById('state').textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/[\u064B-\u065F\u200c]/g,"").trim();
const fa = n => Number(n).toLocaleString("fa-IR");
const digits = s => String(s).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[^\d]/g,"");
const THEMES = {color:"رنگی", white:"سفید", black:"سیاه"};
let cat = "همه", isAdmin = false, editId = null, armed = "", dirty = false;

// shell
document.getElementById('root').append(document.getElementById('shell').content.cloneNode(true));

function getUser(){ try{ return localStorage.getItem("pb_user"); }catch(e){ return null; } }
function setUser(u){ try{ u ? localStorage.setItem("pb_user",u) : localStorage.removeItem("pb_user"); }catch(e){} }

function applyBrand(){
  document.documentElement.dataset.theme = S.theme;
  document.title = S.name;
  document.querySelectorAll('.nm').forEach(n=>n.textContent=S.name);
}
function show(user){
  $("login").hidden = !!user; $("shop").hidden = !user;
  if(user){ $("who").textContent = "@"+user; renderAll(); }
}
function tryLogin(){
  const v = $("tg").value.trim().replace(/^@/,"");
  if(!/^[A-Za-z][A-Za-z0-9_]{4,31}$/.test(v)){
    $("err").textContent = "نام کاربری باید ۵ تا ۳۲ نویسه لاتین، عدد یا _ باشد و با حرف شروع شود.";
    return;
  }
  $("err").textContent = ""; setUser(v); show(v);
}
$("loginBtn").onclick = tryLogin;
$("tg").addEventListener("keydown",e=>{ if(e.key==="Enter") tryLogin(); });
$("logout").onclick = ()=>{ setUser(null); $("tg").value=""; show(null); };
$("q").addEventListener("input", renderGrid);

function renderCats(){
  if(cat!=="همه" && !S.cats.includes(cat)) cat="همه";
  $("cats").innerHTML = ["همه",...S.cats].map(c=>`<button class="chip" type="button" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
}
$("cats").onclick = e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  cat = b.dataset.c; renderCats(); renderGrid();
};
function renderGrid(){
  const q = norm($("q").value);
  const list = S.products.filter(p=>(cat==="همه"||p.c===cat) && (!q || norm(p.n+" "+p.c+" "+p.d).includes(q)));
  $("count").textContent = list.length ? `${fa(list.length)} محصول` : "";
  $("grid").innerHTML = list.length ? list.map((p,i)=>`
    <article class="item px">
      <div class="thumb" style="background-color:var(--t${i%4+1})" aria-hidden="true">${esc(p.e||"📦")}</div>
      <div class="info"><h3>${esc(p.n)}</h3><small>${esc(p.c||"بدون دسته")}</small><small>${esc(p.d)}</small>
      <div class="price">${fa(p.p)} تومان</div>
      ${isAdmin?`<div class="adm"><button class="btn sm" type="button" data-act="editprod" data-id="${p.id}">ویرایش</button><button class="btn sm${armed==="p"+p.id?" armed":""}" type="button" data-act="delprod" data-id="${p.id}">${armed==="p"+p.id?"مطمئنید؟":"حذف"}</button></div>`:""}
      </div>
    </article>`).join("")
    : `<div class="empty px" style="grid-column:1/-1"><b>محصولی پیدا نشد</b>عبارت دیگری را جستجو کنید یا دسته‌بندی را روی «همه» بگذارید.</div>`;
}
function renderAdmin(){
  $("a-name").value = S.name;
  $("a-themes").innerHTML = Object.entries(THEMES).map(([k,v])=>`<button class="chip" type="button" data-act="theme" data-t="${k}" aria-pressed="${S.theme===k}">${v}</button>`).join("");
  $("a-cats").innerHTML = S.cats.map((c,i)=>`<div class="row"><input class="in" data-i="${i}" value="${esc(c)}" maxlength="30" aria-label="نام دسته‌بندی"><button class="btn sm${armed==="c"+i?" armed":""}" type="button" data-act="delcat" data-i="${i}">${armed==="c"+i?"مطمئنید؟":"حذف"}</button></div>`).join("") || "<p>هنوز دسته‌بندی‌ای ندارید.</p>";
  const cur = $("p-cat").value;
  $("p-cat").innerHTML = S.cats.map(c=>`<option>${esc(c)}</option>`).join("");
  if(S.cats.includes(cur)) $("p-cat").value = cur;
}
function renderAll(){ applyBrand(); renderCats(); renderGrid(); if(!$("panel").hidden) renderAdmin(); }
function mark(){ dirty = true; $("status").textContent = "تغییرات هنوز منتشر نشده‌اند."; }

function clearForm(){
  editId = null; $("a-ptitle").textContent = "محصول جدید";
  ["p-name","p-emoji","p-price","p-desc"].forEach(i=>$(i).value=""); $("p-err").textContent="";
}
function saveProd(){
  const n = $("p-name").value.trim(), pr = parseInt(digits($("p-price").value)||"0",10);
  if(!n){ $("p-err").textContent = "نام محصول را وارد کنید."; return; }
  if(!S.cats.length){ $("p-err").textContent = "ابتدا یک دسته‌بندی بسازید."; return; }
  const o = {n, c:$("p-cat").value, e:$("p-emoji").value.trim()||"📦", p:pr, d:$("p-desc").value.trim()};
  if(editId){ Object.assign(S.products.find(p=>p.id===editId), o); }
  else S.products.unshift({id:"p"+Date.now().toString(36), ...o});
  clearForm(); mark(); renderGrid();
}

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a!=="delprod" && a!=="delcat" && armed){ armed=""; renderGrid(); if(!$("panel").hidden) renderAdmin(); }
  if(a==="open"){ $("panel").hidden=false; renderAdmin(); }
  else if(a==="close"){ $("panel").hidden=true; }
  else if(a==="theme"){ S.theme=b.dataset.t; applyBrand(); renderAdmin(); mark(); }
  else if(a==="addcat"){
    const v=$("a-newcat").value.trim();
    if(v && !S.cats.includes(v)){ S.cats.push(v); $("a-newcat").value=""; mark(); renderAdmin(); renderCats(); }
  }
  else if(a==="delcat"){
    const i=+b.dataset.i;
    if(armed==="c"+i){ const old=S.cats[i]; S.cats.splice(i,1); S.products.forEach(p=>{ if(p.c===old) p.c=""; }); armed=""; mark(); renderAdmin(); renderCats(); renderGrid(); }
    else { armed="c"+i; renderAdmin(); }
  }
  else if(a==="editprod"){
    const p=S.products.find(x=>x.id===b.dataset.id); if(!p) return;
    editId=p.id; $("panel").hidden=false; renderAdmin();
    $("a-ptitle").textContent="ویرایش محصول";
    $("p-name").value=p.n; if(S.cats.includes(p.c)) $("p-cat").value=p.c; $("p-emoji").value=p.e; $("p-price").value=p.p; $("p-desc").value=p.d;
    $("p-name").focus();
  }
  else if(a==="delprod"){
    const k="p"+b.dataset.id;
    if(armed===k){ S.products=S.products.filter(p=>p.id!==b.dataset.id); armed=""; mark(); renderGrid(); }
    else { armed=k; renderGrid(); }
  }
  else if(a==="saveprod") saveProd();
  else if(a==="cancelprod") clearForm();
  else if(a==="publish") publish();
  else if(a==="adminlogin") openAuth();
  else if(a==="authgo") authGo();
  else if(a==="authcancel") $("auth").hidden=true;
  else if(a==="adminout"){ try{ sessionStorage.removeItem("pb_ah"); }catch(e){} setAdmin(false); }
  else if(a==="changepw") changePw();
});
document.addEventListener("input", e=>{
  if(e.target.id==="a-name"){ S.name=e.target.value.trim()||"Pixel Bazzar"; applyBrand(); mark(); }
});
document.addEventListener("change", e=>{
  const i=e.target.dataset && e.target.dataset.i;
  if(i!==undefined && e.target.closest("#a-cats")){
    const v=e.target.value.trim(), old=S.cats[+i];
    if(!v || (S.cats.includes(v) && v!==old)){ e.target.value=old; return; }
    S.cats[+i]=v; S.products.forEach(p=>{ if(p.c===old) p.c=v; });
    if(cat===old) cat=v;
    mark(); renderCats(); renderGrid(); renderAdmin();
  }
});

function buildDoc(){
  const json = JSON.stringify(S).replace(/</g,"\\u003c");
  return '<!DOCTYPE html>\n<html lang="fa" dir="rtl" data-theme="'+S.theme+'"><head><meta charset="utf-8">'
    +'<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+esc(S.name)+'</title>'
    +'<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">'
    +'<style id="css">'+document.getElementById('css').textContent+'</style></head><body>'
    +'<template id="shell">'+document.getElementById('shell').innerHTML+'</template><div id="root"></div>'
    +'<script type="application/json" id="state">'+json+'<\/script>'
    +'<script id="app">'+document.getElementById('app').textContent+'<\/script></body></html>';
}
async function publish(){
  const st=$("status");
  try{
    const art = await claude.use("artifact");
    if(!art){ st.textContent="انتشار در این نمای صفحه ممکن نیست."; return; }
    st.textContent="در حال انتشار…";
    await art.publish(buildDoc());
  }catch(err){
    const c = err && err.code;
    st.textContent = c==="conflict" ? "نسخه جدیدتری منتشر شده است؛ صفحه دوباره بارگذاری می‌شود." : (c==="not_writer"||c==="not_granted") ? "انتشار فقط با حساب مالک صفحه در claude.ai ممکن است." : "انتشار انجام نشد. دوباره تلاش کنید.";
  }
}

let canOwn = false;
async function hashPw(pw,salt){
  const enc = new TextEncoder();
  const k = await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:100000,hash:"SHA-256"},k,256);
  return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function newSalt(){ return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,"0")).join(""); }
function keepSession(h){ try{ sessionStorage.setItem("pb_ah",h); }catch(e){} }
function setAdmin(v){
  isAdmin = v; $("fab").hidden = !v; $("adminLink").hidden = v;
  if(!v) $("panel").hidden = true;
  renderGrid();
}
function openAuth(){
  const setup = !S.ph;
  $("au-pw").value = $("au-pw2").value = ""; $("au-err").textContent = "";
  $("au-2").hidden = !setup;
  $("au-title").textContent = setup ? "تعیین رمز مدیر" : "ورود مدیر";
  $("au-go").textContent = setup ? "ثبت رمز" : "ورود";
  const blocked = setup && !canOwn;
  $("au-text").textContent = blocked ? "رمز مدیر هنوز تعیین نشده است. فقط مالک صفحه (با حساب claude.ai) می‌تواند آن را تعیین کند." : setup ? "یک رمز برای ورود به پنل مدیریت انتخاب کنید." : "رمز مدیر را وارد کنید.";
  $("au-fields").hidden = blocked; $("au-go").hidden = blocked;
  $("auth").hidden = false;
  if(!blocked) $("au-pw").focus();
}
async function authGo(){
  const pw = $("au-pw").value, er = $("au-err");
  try{
    if(!S.ph){
      if(!canOwn){ er.textContent = "فقط مالک صفحه می‌تواند رمز را تعیین کند."; return; }
      if(pw.length<6){ er.textContent = "رمز باید حداقل ۶ نویسه باشد."; return; }
      if(pw!==$("au-pw2").value){ er.textContent = "تکرار رمز با رمز اول یکسان نیست."; return; }
      S.salt = newSalt(); S.ph = await hashPw(pw,S.salt); keepSession(S.ph);
      $("auth").hidden = true; setAdmin(true); $("panel").hidden = false; renderAdmin();
      mark(); $("status").textContent = "رمز ثبت شد؛ برای ماندگار شدن، «ذخیره و انتشار» را بزنید.";
    } else {
      const h = await hashPw(pw,S.salt);
      if(h!==S.ph){ er.textContent = "رمز اشتباه است."; return; }
      keepSession(h); $("auth").hidden = true; setAdmin(true); $("panel").hidden = false; renderAdmin();
    }
  }catch(e){ er.textContent = "این مرورگر از رمزنگاری پشتیبانی نمی‌کند."; }
}
async function changePw(){
  const er = $("c-err"), o = $("c-old").value, n = $("c-new").value;
  er.textContent = "";
  try{
    if(await hashPw(o,S.salt)!==S.ph){ er.textContent = "رمز فعلی اشتباه است."; return; }
    if(n.length<6){ er.textContent = "رمز جدید باید حداقل ۶ نویسه باشد."; return; }
    if(n!==$("c-new2").value){ er.textContent = "تکرار رمز جدید یکسان نیست."; return; }
    S.salt = newSalt(); S.ph = await hashPw(n,S.salt); keepSession(S.ph);
    ["c-old","c-new","c-new2"].forEach(i=>$(i).value="");
    mark(); $("status").textContent = "رمز جدید ثبت شد؛ برای اعمال، «ذخیره و انتشار» را بزنید.";
  }catch(e){ er.textContent = "تغییر رمز انجام نشد."; }
}
["au-pw","au-pw2"].forEach(i=>$(i).addEventListener("keydown",e=>{ if(e.key==="Enter") authGo(); }));
applyBrand();
show(getUser());
try{ const h = sessionStorage.getItem("pb_ah"); if(S.ph && h && h===S.ph) setAdmin(true); }catch(e){}
(async()=>{
  try{ const u = await claude.use("user"); canOwn = !!(u && await u.canEdit()); }catch(e){}
})();
