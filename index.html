
<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="color">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Bazzar</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e6f7;--surface:#fff;--ink:#1d1b3a;--muted:#5d5a80;--accent:#ff5c8a;--accent2:#ffd23f;--ok:#12a56a;--line:#1d1b3a;--t1:#9be7c4;--t2:#ffd23f;--t3:#ff9db8;--t4:#a9b8ff}
:root[data-theme=white]{--bg:#fff;--surface:#fff;--ink:#000;--muted:#555;--accent:#000;--accent2:#eee;--ok:#000;--line:#000;--t1:#fff;--t2:#eee;--t3:#ddd;--t4:#f4f4f4}
:root[data-theme=black]{--bg:#000;--surface:#0d0d0d;--ink:#fff;--muted:#aaa;--accent:#fff;--accent2:#222;--ok:#fff;--line:#fff;--t1:#111;--t2:#1c1c1c;--t3:#262626;--t4:#161616}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1000px;margin:auto;padding:20px 16px 90px}
.logo{font-family:"Press Start 2P",monospace;font-size:16px;display:flex;align-items:center;gap:12px;line-height:1.8}
.logo i{width:22px;height:22px;background:var(--accent);border:2px solid var(--line);box-shadow:6px 6px var(--accent2)}
.px{border:3px solid var(--line);background:var(--surface);box-shadow:6px 6px var(--line)}
.btn{border:3px solid var(--line);background:var(--accent2);padding:7px 15px;font-weight:800;box-shadow:4px 4px var(--line)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.pri{background:var(--accent);color:var(--bg)}
.btn.sm{font-size:13px;padding:3px 10px;box-shadow:3px 3px var(--line)}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.user{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.user b{direction:ltr;background:var(--accent2);padding:2px 9px;border:2px solid var(--line)}
#login{display:grid;place-items:center;min-height:90vh}
.card{width:100%;max-width:420px;padding:25px}
.card h2{margin:14px 0 5px}
.card p{color:var(--muted);margin:0 0 15px}
.field{display:flex;direction:ltr;border:3px solid var(--line);background:var(--bg)}
.field span{background:var(--accent);padding:9px 14px;color:var(--bg);font-weight:bold}
.field input{flex:1;min-width:0;border:0;background:transparent;padding:9px;direction:ltr}
#loginBtn{width:100%;margin-top:12px}
.err{color:#e5322d;min-height:24px;font-size:14px}
.search{display:flex;border:3px solid var(--line);background:var(--surface);box-shadow:6px 6px var(--line);margin-bottom:14px}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:13px;font-size:16px}
.search em{background:var(--accent);padding:0 17px;display:grid;place-items:center;font-size:22px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.chip{border:2px solid var(--line);background:var(--surface);padding:3px 13px;font-weight:600}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.count{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}
.item{display:flex;flex-direction:column}
.thumb{height:130px;display:grid;place-items:center;font-size:55px;border-bottom:3px solid var(--line)}
.info{padding:12px;display:flex;flex-direction:column;flex:1}
.info h3{margin:0;font-size:16px}
.info small{color:var(--muted)}
.price{margin-top:auto;padding-top:9px;color:var(--ok);font-weight:800}
.adm{display:flex;gap:8px;padding-top:12px}
.empty{text-align:center;padding:35px;grid-column:1/-1}
#adminLink,#fab{position:fixed;bottom:16px;left:16px;z-index:6}
#panel,#auth{position:fixed;inset:0;z-index:10;background:#0009;padding:12px;display:flex;justify-content:flex-start}
#auth{z-index:20;display:grid;place-items:center}
.sheet{width:min(470px,100%);height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column}
.sheet h2{margin:0 0 10px}
.sheet section{border-top:3px solid var(--line);padding:14px 0}
.sheet h3{margin:0 0 10px}
.sheet label{display:block;font-weight:600;font-size:14px;margin:8px 0 4px}
.in{width:100%;border:3px solid var(--line);background:var(--bg);padding:7px 9px}
.row{display:flex;gap:8px;align-items:center;margin:9px 0}
.row .in{flex:1;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.themes{display:flex;gap:8px;flex-wrap:wrap}
.foot{position:sticky;bottom:0;margin-top:auto;background:var(--surface);border-top:3px solid var(--line);padding:12px 0;display:flex;gap:8px;flex-wrap:wrap}
#status{flex-basis:100%;color:var(--muted);font-size:13px}
[hidden]{display:none!important}
@media(max-width:480px){.logo{font-size:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.thumb{height:100px}.info{padding:9px}.card{padding:20px}}
</style>
</head>
<body>

<main id="login" class="wrap">
<form class="card px" id="loginForm">
<h1 class="logo"><i></i><span id="loginBrand">Pixel Bazzar</span></h1>
<h2>ورود به بازار</h2>
<p>برای دیدن محصولات، نام کاربری تلگرام خود را وارد کنید.</p>
<label for="tg">نام کاربری تلگرام</label>
<div class="field"><span>@</span><input id="tg" placeholder="username" maxlength="33" autocomplete="username"></div>
<div class="err" id="err"></div>
<button class="btn pri" id="loginBtn" type="submit">ورود با تلگرام</button>
</form>
</main>

<main id="shop" class="wrap" hidden>
<header class="top">
<h1 class="logo"><i></i><span id="brand">Pixel Bazzar</span></h1>
<div class="user"><span>خوش آمدید</span><b id="who"></b><button class="btn sm" id="logout">خروج</button></div>
</header>
<label class="search">
<input id="q" type="search" placeholder="جستجوی محصول…" aria-label="جستجو">
<em>⌕</em>
</label>
<div class="cats" id="cats"></div>
<p class="count" id="count"></p>
<div class="grid" id="grid"></div>
</main>

<button class="btn pri" id="fab" hidden>مدیریت فروشگاه</button>
<button class="btn" id="adminLink">ورود مدیر</button>

<div id="auth" hidden>
<div class="card px">
<h2 id="au-title">ورود مدیر</h2>
<p id="au-text">رمز مدیر را وارد کنید.</p>
<label>رمز</label>
<input class="in" id="au-pw" type="password" dir="ltr">
<div id="au-2" hidden><label>تکرار رمز</label><input class="in" id="au-pw2" type="password" dir="ltr"></div>
<div class="err" id="au-err"></div>
<div class="row"><button class="btn pri" id="au-go">ورود</button><button class="btn" id="au-cancel">انصراف</button></div>
</div>
</div>

<aside id="panel" hidden>
<div class="sheet px">
<h2>مدیریت فروشگاه</h2>
<section>
<h3>نام و ظاهر</h3>
<label>نام فروشگاه</label>
<input class="in" id="a-name" maxlength="40">
<label>پوسته</label>
<div class="themes" id="a-themes"></div>
</section>
<section>
<h3>دسته‌بندی‌ها</h3>
<div id="a-cats"></div>
<div class="row"><input class="in" id="a-newcat" placeholder="دسته‌بندی جدید"><button class="btn sm" id="addcat">افزودن</button></div>
</section>
<section>
<h3 id="a-ptitle">محصول جدید</h3>
<label>نام محصول</label><input class="in" id="p-name" maxlength="60">
<div class="two">
<div><label>دسته‌بندی</label><select class="in" id="p-cat"></select></div>
<div><label>شکلک</label><input class="in" id="p-emoji" maxlength="4" placeholder="🎮"></div>
</div>
<label>قیمت (تومان)</label><input class="in" id="p-price" inputmode="numeric">
<label>توضیح کوتاه</label><input class="in" id="p-desc" maxlength="80">
<div class="row"><button class="btn sm" id="saveprod">ثبت محصول</button><button class="btn sm" id="cancelprod">پاک کردن فرم</button></div>
<div class="err" id="p-err"></div>
</section>
<section>
<h3>رمز مدیر</h3>
<label>رمز فعلی</label><input class="in" id="c-old" type="password">
<label>رمز جدید</label><input class="in" id="c-new" type="password">
<label>تکرار رمز جدید</label><input class="in" id="c-new2" type="password">
<button class="btn sm" id="changepw">تغییر رمز</button>
<div class="err" id="c-err"></div>
</section>
<div class="foot">
<button class="btn pri" id="publish">ذخیره</button>
<button class="btn" id="close">بستن</button>
<button class="btn" id="adminout">خروج مدیر</button>
<div id="status"></div>
</div>
</div>
</aside>

<script>
const defaults={
name:"Pixel Bazzar",theme:"color",
cats:["گیمینگ","لوازم جانبی","دیجیتال","هنر پیکسلی"],
products:[
{id:"p1",n:"کیبورد مکانیکی پیکسلی",c:"گیمینگ",e:"⌨️",p:2450000,d:"سوییچ آبی، نورپردازی ۸ بیتی"},
{id:"p2",n:"موس گیمینگ سبک",c:"گیمینگ",e:"🖱️",p:980000,d:"سنسور ۱۶۰۰۰ دی‌پی‌آی"},
{id:"p3",n:"هدست گیمینگ رترو",c:"گیمینگ",e:"🎧",p:1750000,d:"صدای فراگیر، میکروفون جداشدنی"},
{id:"p4",n:"کنسول دستی ۸ بیتی",c:"گیمینگ",e:"🕹️",p:3200000,d:"بیش از ۴۰۰ بازی کلاسیک"},
{id:"p5",n:"گیفت‌کارت استیم ۲۰ دلاری",c:"دیجیتال",e:"🎮",p:1450000,d:"تحویل فوری کد دیجیتال"},
{id:"p6",n:"گیفت‌کارت پلی‌استیشن",c:"دیجیتال",e:"🎟️",p:1900000,d:"مناسب حساب منطقه آمریکا"},
{id:"p7",n:"اشتراک ماهانه موسیقی",c:"دیجیتال",e:"🎵",p:420000,d:"بدون تبلیغ، کیفیت بالا"},
{id:"p8",n:"پک پیکسل‌آرت کاراکتر",c:"هنر پیکسلی",e:"👾",p:180000,d:"۱۲۰ اسپرایت آماده، فرمت PNG"},
{id:"p9",n:"پک آیکون پیکسلی",c:"هنر پیکسلی",e:"🧩",p:150000,d:"۵۰۰ آیکون ۳۲ در ۳۲"},
{id:"p10",n:"فونت پیکسلی فارسی",c:"دیجیتال",e:"🔤",p:260000,d:"پشتیبانی کامل از حروف فارسی"},
{id:"p11",n:"پوستر دیواری اینویدرز",c:"هنر پیکسلی",e:"🖼️",p:340000,d:"چاپ روی بوم، ۵۰ در ۷۰"},
{id:"p12",n:"چراغ خواب مکعبی",c:"لوازم جانبی",e:"💡",p:520000,d:"نور رنگی با ریموت"},
{id:"p13",n:"ماگ پیکسل قلب",c:"لوازم جانبی",e:"☕",p:210000,d:"سرامیکی، مناسب ماکروفر"},
{id:"p14",n:"پد موس بزرگ شهر شبانه",c:"لوازم جانبی",e:"🌃",p:390000,d:"ضد لغزش، ۹۰ در ۴۰"}
]};
let S=loadStore(),cat="همه",isAdmin=false,editId=null,armed="";
const $=id=>document.getElementById(id);
const themes={color:"رنگی",white:"سفید",black:"سیاه"};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s).toLowerCase().replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/[\u064B-\u065F\u200c]/g,"").trim();
const fa=n=>Number(n).toLocaleString("fa-IR");
function loadStore(){try{let x=JSON.parse(localStorage.getItem("pb_store"));if(x&&Array.isArray(x.products)&&Array.isArray(x.cats))return {...defaults,...x};}catch(e){}return JSON.parse(JSON.stringify(defaults))}
function saveStore(){localStorage.setItem("pb_store",JSON.stringify(S))}
function user(){try{return localStorage.getItem("pb_user")}catch(e){return null}}
function setUser(v){try{v?localStorage.setItem("pb_user",v):localStorage.removeItem("pb_user")}catch(e){}}
function applyBrand(){document.documentElement.dataset.theme=S.theme;$("brand").textContent=S.name;$("loginBrand").textContent=S.name;document.title=S.name}
function show(v){$("login").hidden=!!v;$("shop").hidden=!v;if(v){$("who").textContent="@"+v;renderAll()}}
function renderCats(){if(cat!=="همه"&&!S.cats.includes(cat))cat="همه";$("cats").innerHTML=["همه",...S.cats].map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===cat}">${esc(c)}</button>`).join("")}
function renderGrid(){
let q=norm($("q").value);
let list=S.products.filter(p=>(cat==="همه"||p.c===cat)&&(!q||norm(p.n+" "+p.c+" "+p.d).includes(q)));
$("count").textContent=list.length?fa(list.length)+" محصول":"";
$("grid").innerHTML=list.length?list.map((p,i)=>`<article class="item px"><div class="thumb" style="background:var(--t${i%4+1})">${esc(p.e)}</div><div class="info"><h3>${esc(p.n)}</h3><small>${esc(p.c||"بدون دسته")}</small><small>${esc(p.d)}</small><div class="price">${fa(p.p)} تومان</div>${isAdmin?`<div class="adm"><button class="btn sm" data-edit="${p.id}">ویرایش</button><button class="btn sm" data-delete="${p.id}">حذف</button></div>`:""}</div></article>`).join(""):`<div class="empty px"><b>محصولی پیدا نشد</b>عبارت دیگری را جستجو کنید.</div>`;
}
function renderAdmin(){
$("a-name").value=S.name;
$("a-themes").innerHTML=Object.entries(themes).map(([k,v])=>`<button class="chip" data-theme="${k}" aria-pressed="${S.theme===k}">${v}</button>`).join("");
$("a-cats").innerHTML=S.cats.map((c,i)=>`<div class="row"><input class="in" data-catindex="${i}" value="${esc(c)}"><button class="btn sm" data-removecat="${i}">حذف</button></div>`).join("");
let old=$("p-cat").value;
$("p-cat").innerHTML=S.cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
if(S.cats.includes(old))$("p-cat").value=old;
}
function renderAll(){applyBrand();renderCats();renderGrid();if(!$("panel").hidden)renderAdmin()}
function clearForm(){editId=null;$("a-ptitle").textContent="محصول جدید";["p-name","p-emoji","p-price","p-desc"].forEach(id=>$(id).value="");$("p-err").textContent=""}
function saveProduct(){
let n=$("p-name").value.trim(),p=Number($("p-price").value.replace(/[^\d]/g,""));
if(!n){$("p-err").textContent="نام محصول را وارد کنید.";return}
if(!S.cats.length){$("p-err").textContent="ابتدا دسته‌بندی بسازید.";return}
let obj={n,c:$("p-cat").value,e:$("p-emoji").value.trim()||"📦",p,d:$("p-desc").value.trim()};
if(editId){let old=S.products.find(x=>x.id===editId);if(old)Object.assign(old,obj)}
else S.products.unshift({id:"p"+Date.now(),...obj});
clearForm();renderAll();$("status").textContent="محصول ثبت شد. برای ذخیره، دکمه ذخیره را بزنید."
}
async function hash(p,s){let b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function salt(){return [...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,"0")).join("")}
function openAuth(){
let setup=!localStorage.getItem("pb_hash");
$("auth").hidden=false;$("au-pw").value="";$("au-pw2").value="";$("au-err").textContent="";
$("au-title").textContent=setup?"ساخت رمز مدیر":"ورود مدیر";
$("au-text").textContent=setup?"یک رمز حداقل ۶ نویسه‌ای بسازید.":"رمز مدیر را وارد کنید.";
$("au-go").textContent=setup?"ساخت رمز":"ورود";$("au-2").hidden=!setup;
}
async function authGo(){
let p=$("au-pw").value;
if(p.length<6){$("au-err").textContent="رمز باید حداقل ۶ نویسه باشد.";return}
try{
if(!localStorage.getItem("pb_hash")){
if(p!==$("au-pw2").value){$("au-err").textContent="رمزها یکسان نیستند.";return}
let s=salt();localStorage.setItem("pb_salt",s);localStorage.setItem("pb_hash",await hash(p,s));
}else if(await hash(p,localStorage.getItem("pb_salt"))!==localStorage.getItem("pb_hash")){
$("au-err").textContent="رمز اشتباه است.";return
}
$("auth").hidden=true;isAdmin=true;$("fab").hidden=false;$("adminLink").hidden=true;$("panel").hidden=false;renderAll();
}catch(e){$("au-err").textContent="مرورگر شما امکان بررسی رمز را فراهم نکرد."}
}
function changePassword(){
let old=$("c-old").value,n=$("c-new").value,n2=$("c-new2").value;
if(n.length<6){$("c-err").textContent="رمز جدید حداقل ۶ نویسه باشد.";return}
if(n!==n2){$("c-err").textContent="تکرار رمز یکسان نیست.";return}
hash(old,localStorage.getItem("pb_salt")).then(async h=>{
if(h!==localStorage.getItem("pb_hash")){$("c-err").textContent="رمز فعلی اشتباه است.";return}
let s=salt();localStorage.setItem("pb_salt",s);localStorage.setItem("pb_hash",await hash(n,s));
$("c-err").textContent="رمز تغییر کرد."
});
}
$("loginForm").addEventListener("submit",e=>{e.preventDefault();let v=$("tg").value.trim().replace(/^@/,"");if(!/^[A-Za-z][A-Za-z0-9_]{4,31}$/.test(v)){$("err").textContent="نام کاربری باید ۵ تا ۳۲ نویسه و با حرف شروع شود.";return}$("err").textContent="";setUser(v);show(v)});
$("logout").onclick=()=>{setUser(null);$("tg").value="";show(null)};
$("q").oninput=renderGrid;
$("cats").onclick=e=>{let b=e.target.closest("[data-cat]");if(!b)return;cat=b.dataset.cat;renderCats();renderGrid()};
$("adminLink").onclick=openAuth;
$("fab").onclick=()=>{$("panel").hidden=false;renderAdmin()};
$("au-go").onclick=authGo;
$("au-cancel").onclick=()=>$("auth").hidden=true;
$("close").onclick=()=>$("panel").hidden=true;
$("adminout").onclick=()=>{isAdmin=false;$("panel").hidden=true;$("fab").hidden=true;$("adminLink").hidden=false;renderGrid()};
$("addcat").onclick=()=>{let v=$("a-newcat").value.trim();if(v&&!S.cats.includes(v)){S.cats.push(v);$("a-newcat").value="";renderAll()}};
$("saveprod").onclick=saveProduct;
$("cancelprod").onclick=clearForm;
$("publish").onclick=()=>{S.name=$("a-name").value.trim()||S.name;saveStore();renderAll();$("status").textContent="تغییرات در این مرورگر ذخیره شد."};
$("changepw").onclick=changePassword;
$("a-themes").onclick=e=>{let b=e.target.closest("[data-theme]");if(!b)return;S.theme=b.dataset.theme;renderAll()};
$("a-cats").addEventListener("change",e=>{let i=e.target.dataset.catindex;if(i===undefined)return;let old=S.cats[+i],v=e.target.value.trim();if(!v||S.cats.some((x,j)=>j!==+i&&x===v)){renderAdmin();return}S.cats[+i]=v;S.products.forEach(p=>{if(p.c===old)p.c=v});renderAll()});
$("a-cats").onclick=e=>{let b=e.target.closest("[data-removecat]");if(!b)return;let i=+b.dataset.removecat,old=S.cats[i];if(!confirm("این دسته‌بندی حذف شود؟"))return;S.cats.splice(i,1);S.products.forEach(p=>{if(p.c===old)p.c=""});renderAll()};
$("grid").onclick=e=>{
let ed=e.target.closest("[data-edit]"),del=e.target.closest("[data-delete]");
if(ed){let p=S.products.find(x=>x.id===ed.dataset.edit);if(!p)return;editId=p.id;$("panel").hidden=false;renderAdmin();$("a-ptitle").textContent="ویرایش محصول";$("p-name").value=p.n;$("p-cat").value=p.c;$("p-emoji").value=p.e;$("p-price").value=p.p;$("p-desc").value=p.d}
if(del){let p=S.products.find(x=>x.id===del.dataset.delete);if(p&&confirm("این محصول حذف شود؟")){S.products=S.products.filter(x=>x.id!==p.id);renderAll()}}
};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("panel").hidden=true;$("auth").hidden=true}});
applyBrand();show(user());
</script>
</body>
</html>
